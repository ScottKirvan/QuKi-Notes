name: quki_notes
description: "QuKi-Notes — capture and toss ephemeral notes."
publish_to: 'none'
version: 0.14.6+32

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  path: ^1.9.1
  path_provider: ^2.1.5
  uuid: ^4.5.3
  markdown_live_editor:
    path: packages/markdown_live_editor
  shared_preferences: ^2.5.5
  logging: ^1.3.0
  package_info_plus: ^8.0.0
  share_plus: ^10.0.0
  receive_sharing_intent: ^1.8.1
  window_manager: ^0.5.1
  lucide_flutter: ^1.17.0
  file_picker: ^8.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  flutter_markdown: ^0.7.0
  flutter_launcher_icons: ^0.14.3
  plugin_platform_interface: ^2.1.8

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "media/QuKiNotes_v2_Rainbow.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "media/QuKiNotes_v2_Rainbow.png"
  windows:
    generate: true
    image_path: "media/QuKiNotes_v2_Rainbow_transparent.png"
    icon_size: 48
  linux:
    generate: true
    image_path: "media/QuKiNotes_v2_Rainbow_transparent.png"

flutter:
  uses-material-design: true
