# Dependabot version updates, kept low-noise on purpose:
# - Monthly. Minor and patch bumps are grouped into one PR per ecosystem;
#   each major bump gets its own PR, since those are the ones that break things.
# - Commits use `chore(deps):`, so release-please doesn't cut a release for them;
#   they ship with the next real release.
# - Cooldown: a new release waits 7 days before Dependabot offers it, so a
#   compromised or broken release is usually caught and pulled first.
#   Security fix PRs are not delayed.
# - Gradle is left out: Capacitor sets the Android dependency versions.
#
# Security updates are a separate repo setting (Settings > Code security) and
# open PRs for vulnerable packages as soon as an alert appears, using the
# options below.

version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/project"
      - "/project/core"
      - "/project/cli"
      - "/project/electron"
      - "/project/mcp"
      - "/docs"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
      include: "scope"
