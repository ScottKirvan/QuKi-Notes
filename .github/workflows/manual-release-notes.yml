name: Manual — Rewrite Release Notes

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to rewrite notes for (e.g. v0.20.0)
        required: true
        type: string

permissions:
  contents: write
  models: read

jobs:
  improve-release-notes:
    uses: ScottKirvan/.github/.github/workflows/reusable-release-notes.yml@main
    with:
      tag_name: ${{ inputs.tag_name }}
      project_name: "QuKi Notes"
      project_context: "QuKi Notes is a lightweight note-taking app for Android, Windows, and Linux. It's for people who need to capture a quick thought before it slips away and send it somewhere useful — then move on. Notes are ephemeral by design: write it, send it, let it go. When a change improves performance, UI, or platform behavior, write in terms of what the user can now do or what annoyance is gone."
      header: |
        ## QuKi Notes

        > Jot it down, send it somewhere, and let it go.

        🫶❤️[Support this project](https://ko-fi.com/ScottKirvan) · 📖 [User Guide](https://www.scottkirvan.com/QuKi-Notes/) · 💬 [Discord](https://discord.gg/TN6XJSNK5Y) · 🐛 [Report a Bug](https://github.com/ScottKirvan/QuKi-Notes/issues/new?template=bug_report.md) · ✨ [Request Feature](https://github.com/ScottKirvan/QuKi-Notes/issues/new?template=feature_request.md) · 📋 [Changelog](https://github.com/ScottKirvan/QuKi-Notes/blob/main/notes/CHANGELOG.md)

        ---
      footer: ""
      changelog_path: ""
    secrets: inherit
