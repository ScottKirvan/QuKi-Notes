name: Post-Build Discord Notify

on:
  workflow_run:
    workflows: ["Build Android", "Build Windows", "Build Linux"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      all_done: ${{ steps.check.outputs.all_done }}
      tag_name: ${{ steps.check.outputs.tag_name }}
    steps:
      - name: Check if all builds are complete
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          BUILD_WORKFLOWS=("Build Android" "Build Windows" "Build Linux")

          for WF in "${BUILD_WORKFLOWS[@]}"; do
            STATUS=$(gh api "repos/$REPO/actions/runs?per_page=20" \
              --jq "[.workflow_runs[] | select(.name == \"$WF\" and .head_sha == \"$HEAD_SHA\")] | first | .status // \"not_found\"")
            echo "$WF: $STATUS"
            if [ "$STATUS" != "completed" ]; then
              echo "all_done=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          # All builds complete — get the latest release tag
          TAG=$(gh release list --repo "$REPO" --limit 1 --json tagName --jq '.[0].tagName')

          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "No release found, skipping"
            echo "all_done=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "all_done=true" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

  get-blurb:
    needs: check
    if: needs.check.outputs.all_done == 'true'
    runs-on: ubuntu-latest
    outputs:
      discord_blurb: ${{ steps.read.outputs.discord_blurb }}
    steps:
      - name: Find blurb artifact run
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.tag_name }}
        run: |
          RUN_ID=$(gh api "repos/$REPO/actions/artifacts?name=discord-blurb-$TAG&per_page=5" \
            --jq '.artifacts | sort_by(.created_at) | reverse | .[0].workflow_run.id // ""')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download blurb artifact
        if: steps.find.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: discord-blurb-${{ needs.check.outputs.tag_name }}
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ github.token }}
          path: /tmp/blurb/

      - name: Read blurb
        id: read
        run: |
          BLURB=$(cat /tmp/blurb/discord_blurb.txt 2>/dev/null || echo "")
          {
            echo 'discord_blurb<<BLURB_EOF'
            printf '%s\n' "$BLURB"
            echo 'BLURB_EOF'
          } >> "$GITHUB_OUTPUT"

  notify:
    needs: [check, get-blurb]
    if: needs.check.outputs.all_done == 'true'
    uses: ScottKirvan/.github/.github/workflows/reusable-discord-notify.yml@main
    with:
      tag_name: ${{ needs.check.outputs.tag_name }}
      project_name: "QuKi Notes"
      emoji: "🪽"
      discord_blurb: ${{ needs.get-blurb.outputs.discord_blurb }}
    secrets: inherit
