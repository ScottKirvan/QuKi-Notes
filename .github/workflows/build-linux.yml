name: Build Linux

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
            appimagetool_arch: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            appimagetool_arch: aarch64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # core must be built first — the web app and electron both import from core/dist/
      - name: Install (core)
        run: npm ci
        working-directory: project/core

      - name: Build (core)
        run: npm run build
        working-directory: project/core

      - name: Install (app)
        run: npm ci
        working-directory: project

      - name: Build web app
        run: npm run build
        working-directory: project

      # cli and mcp each bundle to a single self-contained .mjs (see
      # cli/scripts/bundle.mjs, mcp/scripts/bundle.mjs). electron-builder's
      # extraResources copies dist-bundle/ into the packaged app.
      # AppImage users: the AppRun dispatcher below symlinks quki/quki-mcp to
      # the AppImage and invokes ELECTRON_RUN_AS_NODE=1 on the bundled .mjs.
      # deb users: afterInstall.sh puts /usr/bin/quki and /usr/bin/quki-mcp
      # wrapper scripts pointing at the same bundled .mjs files.
      - name: Install (cli)
        run: npm ci
        working-directory: project/cli

      - name: Bundle CLI
        run: npm run bundle
        working-directory: project/cli

      - name: Install (mcp)
        run: npm ci
        working-directory: project/mcp

      - name: Bundle MCP server
        run: npm run bundle
        working-directory: project/mcp

      - name: Install (electron)
        run: npm ci
        working-directory: project/electron

      - name: Build electron main process
        run: npm run build
        working-directory: project/electron

      # electron-builder's bundled fpm (used for the .deb) is an x86-only Ruby
      # build and can't execute on the arm64 runner. On arm64, install fpm
      # from RubyGems and have app-builder use it via USE_SYSTEM_FPM.
      - name: Install system fpm (arm64)
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install --no-document fpm
          fpm --version

      - name: Package Linux (${{ matrix.arch }})
        run: npm run dist:linux -- --${{ matrix.arch }}
        working-directory: project/electron
        env:
          USE_SYSTEM_FPM: ${{ matrix.arch == 'arm64' && 'true' || '' }}

      # electron-builder's own AppRun always launches the app. Replace it with
      # a small dispatcher so the same AppImage also serves as `quki` and
      # `quki-mcp` when invoked under those names (e.g. via a symlink:
      # ln -s ~/Applications/QuKi-Notes-x64.AppImage ~/.local/bin/quki).
      # AppImage's runtime sets $ARGV0 to the name the .AppImage or symlink
      # was invoked as — the documented mechanism for this pattern.
      # The renamed original AppRun (AppRun.real) keeps electron-builder's
      # library-path setup for normal app launches.
      # ELECTRON_RUN_AS_NODE=1 turns the bundled Electron binary into a plain
      # Node runtime for the CLI/MCP bundles (same mechanism as the Windows
      # NSIS installer's quki.cmd — see build/installer.nsh).
      - name: Patch AppImage AppRun to dispatch quki / quki-mcp by invoked name
        env:
          ARCH: ${{ matrix.arch }}
          APPIMAGETOOL_ARCH: ${{ matrix.appimagetool_arch }}
        run: |
          set -e
          APPIMAGE=$(find project/electron/release -maxdepth 1 -name "*.AppImage" | head -1)
          chmod +x "$APPIMAGE"
          APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGE" --appimage-extract

          mv squashfs-root/AppRun squashfs-root/AppRun.real

          cat > squashfs-root/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          NAME="$(basename "${ARGV0:-$0}")"
          case "$NAME" in
            quki)
              exec env ELECTRON_RUN_AS_NODE=1 "$HERE/AppRun.real" "$HERE/resources/cli/main.mjs" "$@"
              ;;
            quki-mcp)
              exec env ELECTRON_RUN_AS_NODE=1 "$HERE/AppRun.real" "$HERE/resources/mcp/server.mjs" "$@"
              ;;
            *)
              exec "$HERE/AppRun.real" "$@"
              ;;
          esac
          EOF
          chmod +x squashfs-root/AppRun

          wget -q -O appimagetool "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${APPIMAGETOOL_ARCH}.AppImage"
          chmod +x appimagetool

          # Stable per-arch filename — end users symlink once and it stays
          # valid across every future update:
          # ln -s ~/Applications/QuKi-Notes-x64.AppImage ~/.local/bin/quki
          APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool squashfs-root "project/electron/release/QuKi-Notes-${ARCH}.AppImage"
          rm "$APPIMAGE"

      - name: Rename deb with version tag
        if: github.event_name != 'workflow_dispatch'
        env:
          TAG: ${{ github.event.release.tag_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          find project/electron/release -maxdepth 1 -name "*.deb" \
            -exec mv {} "project/electron/release/quki-notes-linux-${ARCH}-${TAG}.deb" \;

      - name: Upload artifacts (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: quki-notes-linux-${{ matrix.arch }}
          path: |
            project/electron/release/*.AppImage
            project/electron/release/*.deb
          retention-days: 14

      - name: Upload to GitHub Release
        if: github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            project/electron/release/QuKi-Notes-${{ matrix.arch }}.AppImage
            project/electron/release/quki-notes-linux-${{ matrix.arch }}-${{ github.event.release.tag_name }}.deb
