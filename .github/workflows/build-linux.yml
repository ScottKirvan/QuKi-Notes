name: Build Linux

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # core must be built first — the web app and electron both import from core/dist/
      - name: Install (core)
        run: npm ci
        working-directory: project/core

      - name: Build (core)
        run: npm run build
        working-directory: project/core

      - name: Install (app)
        run: npm ci
        working-directory: project

      - name: Build web app
        run: npm run build
        working-directory: project

      - name: Install (electron)
        run: npm ci
        working-directory: project/electron

      - name: Build electron main process
        run: npm run build
        working-directory: project/electron

      - name: Package Linux AppImage
        run: npm run dist:linux
        working-directory: project/electron

      - name: Upload AppImage as artifact (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: quki-notes-linux
          path: project/electron/release/*.AppImage
          retention-days: 14

      - name: Rename AppImage with version tag
        if: github.event_name != 'workflow_dispatch'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          SRC=$(ls project/electron/release/*.AppImage | head -1)
          mv "$SRC" "project/electron/release/quki-notes-linux-${TAG}.AppImage"

      - name: Upload to GitHub Release
        if: github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: project/electron/release/quki-notes-linux-${{ github.event.release.tag_name }}.AppImage
