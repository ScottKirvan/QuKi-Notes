name: Build Linux

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # core must be built first — the web app and electron both import from core/dist/
      - name: Install (core)
        run: npm ci
        working-directory: project/core

      - name: Build (core)
        run: npm run build
        working-directory: project/core

      - name: Install (app)
        run: npm ci
        working-directory: project

      - name: Build web app
        run: npm run build
        working-directory: project

      - name: Install (electron)
        run: npm ci
        working-directory: project/electron

      - name: Build electron main process
        run: npm run build
        working-directory: project/electron

      - name: Package Linux (${{ matrix.arch }})
        run: npm run dist:linux -- --${{ matrix.arch }}
        working-directory: project/electron

      - name: Upload artifacts (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: quki-notes-linux-${{ matrix.arch }}
          path: |
            project/electron/release/*.AppImage
            project/electron/release/*.deb
          retention-days: 14

      - name: Rename artifacts with version tag
        if: github.event_name != 'workflow_dispatch'
        env:
          TAG: ${{ github.event.release.tag_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          find project/electron/release -maxdepth 1 -name "*.AppImage" \
            -exec mv {} "project/electron/release/quki-notes-linux-${ARCH}-${TAG}.AppImage" \;
          find project/electron/release -maxdepth 1 -name "*.deb" \
            -exec mv {} "project/electron/release/quki-notes-linux-${ARCH}-${TAG}.deb" \;

      - name: Upload to GitHub Release
        if: github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            project/electron/release/quki-notes-linux-${{ matrix.arch }}-${{ github.event.release.tag_name }}.AppImage
            project/electron/release/quki-notes-linux-${{ matrix.arch }}-${{ github.event.release.tag_name }}.deb
