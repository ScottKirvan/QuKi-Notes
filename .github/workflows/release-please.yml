name: Release Workflow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  models: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .github/release-please/release-please-config.json
          manifest-file: .github/release-please/.release-please-manifest.json

  improve-release-notes:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ScottKirvan/.github/.github/workflows/reusable-release-notes.yml@main
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
      project_name: "QuKi Notes"
      project_context: "QuKi Notes is a lightweight note-taking app for Android, Windows, and Linux. It's for people who need to capture a quick thought before it slips away and send it somewhere useful — then move on. Notes are ephemeral by design: write it, send it, let it go. When a change improves performance, UI, or platform behavior, write in terms of what the user can now do or what annoyance is gone."
      header: |
        ## QuKi Notes

        > Jot it down, send it somewhere, and let it go.

        ---
      footer: |
        ---
        📖 [User Guide](https://www.scottkirvan.com/QuKi-Notes/) · 💬 [Discord](https://discord.gg/TN6XJSNK5Y) · 🐛 [Report a Bug](https://github.com/ScottKirvan/QuKi-Notes/issues/new?template=bug_report.md) · ✨ [Request Feature](https://github.com/ScottKirvan/QuKi-Notes/issues/new?template=feature_request.md)
    secrets: inherit

  store-discord-blurb:
    needs: [release-please, improve-release-notes]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - name: Write blurb to file
        env:
          DISCORD_BLURB: ${{ needs.improve-release-notes.outputs.discord_blurb }}
        run: printf '%s' "$DISCORD_BLURB" > discord_blurb.txt

      - uses: actions/upload-artifact@v4
        with:
          name: discord-blurb-${{ needs.release-please.outputs.tag_name }}
          path: discord_blurb.txt
          retention-days: 7

  update-changelog-prs:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ScottKirvan/.github/.github/workflows/reusable-update-changelog-prs.yml@main
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}

