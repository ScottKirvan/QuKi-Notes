name: Release Workflow

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  models: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .github/release-please/release-please-config.json
          manifest-file: .github/release-please/.release-please-manifest.json

  improve-release-notes:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ScottKirvan/.github/.github/workflows/reusable-release-notes.yml@main
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
      project_name: "QuKi Notes"
      project_context: "QuKi Notes is a cross-platform ephemeral notes app for Android, Windows, and Linux, built with Flutter. It lets you jot down quick thoughts, send them somewhere useful, and move on."
      header: |
        ## QuKi Notes

        > Jot it down, send it somewhere, and let it go.

        ---
      footer: |
        ---
        📖 [User Guide](https://www.scottkirvan.com/QuKi-Notes/) · 💬 [Discord](https://discord.gg/TN6XJSNK5Y) · 🐛 [Report a Bug](https://github.com/ScottKirvan/QuKi-Notes/issues/new?template=bug_report.md) · ✨ [Request Feature](https://github.com/ScottKirvan/QuKi-Notes/issues/new?template=feature_request.md)
    secrets: inherit

