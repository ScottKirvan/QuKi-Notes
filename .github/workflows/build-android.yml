name: Build Android

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore
        # Populate these secrets in the GitHub repo settings:
        #   KEYSTORE_BASE64   — base64-encoded .jks keystore file
        #   KEY_ALIAS         — key alias
        #   KEY_PASSWORD      — key password
        #   STORE_PASSWORD    — keystore password
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

      - name: Compute version code
        id: version
        run: echo "build_number=$(date -u +"%y%j%H%M")" >> "$GITHUB_OUTPUT"

      - name: Build APK (release)
        run: flutter build apk --release --build-number=${{ steps.version.outputs.build_number }}
        env:
          STORE_FILE: keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build AAB (release)
        run: flutter build appbundle --release --build-number=${{ steps.version.outputs.build_number }}
        env:
          STORE_FILE: keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK as artifact (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: quki-notes-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload to GitHub Release
        if: github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

      - name: Prepare whatsnew directory
        run: mkdir -p whatsnew

      - name: Find play store notes artifact
        if: github.event_name == 'release'
        id: find-notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          RUN_ID=$(gh api "repos/$REPO/actions/artifacts?name=play-store-notes-$TAG&per_page=5" \
            --jq '.artifacts | sort_by(.created_at) | reverse | .[0].workflow_run.id // ""')
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "run_id=" >> "$GITHUB_OUTPUT"
          else
            echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Download play store notes
        if: github.event_name == 'release' && steps.find-notes.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: play-store-notes-${{ github.event.release.tag_name }}
          run-id: ${{ steps.find-notes.outputs.run_id }}
          github-token: ${{ github.token }}
          path: /tmp/play-notes/

      - name: Write whatsnew file
        if: github.event_name == 'release' && steps.find-notes.outputs.run_id != ''
        run: |
          cp /tmp/play-notes/play-store-notes.txt whatsnew/whatsnew-en-US
          echo "Play Store notes:"
          cat whatsnew/whatsnew-en-US

      - name: Upload to Play Store (alpha)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.quki.quki_notes
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: alpha
          status: completed
          whatsNewDirectory: whatsnew
