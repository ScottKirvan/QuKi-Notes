name: Build Android

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # core must be built first — the web app imports from core/dist/
      - name: Install (core)
        run: npm ci
        working-directory: project/core

      - name: Build (core)
        run: npm run build
        working-directory: project/core

      - name: Install (app)
        run: npm ci
        working-directory: project

      - name: Build web app
        run: npm run build
        working-directory: project

      - name: Sync Capacitor
        run: npx cap sync android
        working-directory: project

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > project/android/app/keystore.jks

      - name: Compute version
        id: version
        run: |
          BUILD_NUMBER=$(date -u +"%y%j%H%M")
          BASE_VERSION=$(node -p "require('./project/package.json').version")
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build_name=${BASE_VERSION}.${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          else
            echo "build_name=${BASE_VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Make gradlew executable
        run: chmod +x project/android/gradlew

      - name: Build APK (release)
        run: ./gradlew assembleRelease
        working-directory: project/android
        env:
          STORE_FILE: keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          BUILD_NAME: ${{ steps.version.outputs.build_name }}

      - name: Build AAB (release)
        run: ./gradlew bundleRelease
        working-directory: project/android
        env:
          STORE_FILE: keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          BUILD_NAME: ${{ steps.version.outputs.build_name }}

      - name: Upload APK as artifact (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: quki-notes-apk
          path: project/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Rename APK with version tag
        if: github.event_name != 'workflow_dispatch'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mv project/android/app/build/outputs/apk/release/app-release.apk \
             "project/android/app/build/outputs/apk/release/quki-notes-android-${TAG}.apk"

      - name: Upload to GitHub Release
        if: github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: project/android/app/build/outputs/apk/release/quki-notes-android-${{ github.event.release.tag_name }}.apk

      - name: Find play store notes artifact
        if: github.event_name == 'release'
        id: find-notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          RUN_ID=$(gh api "repos/$REPO/actions/artifacts?name=play-store-notes-$TAG&per_page=5" \
            --jq '.artifacts | sort_by(.created_at) | reverse | .[0].workflow_run.id // ""')
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "run_id=" >> "$GITHUB_OUTPUT"
          else
            echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Download play store notes
        if: github.event_name == 'release' && steps.find-notes.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: play-store-notes-${{ github.event.release.tag_name }}
          run-id: ${{ steps.find-notes.outputs.run_id }}
          github-token: ${{ github.token }}
          path: /tmp/play-notes/

      - name: Write whatsnew file
        if: github.event_name == 'release' && steps.find-notes.outputs.run_id != ''
        run: |
          mkdir -p whatsnew
          cp /tmp/play-notes/play-store-notes.txt whatsnew/whatsnew-en-US

      - name: Upload to Play Store (alpha)
        if: github.event_name == 'release'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.quki.quki_notes
          releaseFiles: project/android/app/build/outputs/bundle/release/app-release.aab
          tracks: alpha
          status: completed
          whatsNewDirectory: whatsnew
