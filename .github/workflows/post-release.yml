name: Post-Release

on:
  workflow_run:
    workflows: ["Build Android", "Build Windows", "Build Linux", "Deploy Web App", "Release Workflow"]
    types: [completed]

# Serialize runs per commit SHA so only one instance can be active at a time.
# cancel-in-progress: false means newer runs queue rather than cancelling the
# active run — the active run sends and uploads a marker; the queued run finds
# the marker and exits without a second send.
concurrency:
  group: discord-notify-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      all_done: ${{ steps.check.outputs.all_done }}
      tag_name: ${{ steps.check.outputs.tag_name }}
    steps:
      # Release Workflow is required because its store-discord-blurb job saves
      # the announcement text notify uses, and its notes step rewrites the
      # release body notify falls back to.
      - name: Check if every release workflow is complete
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          REQUIRED_WORKFLOWS=("Build Android" "Build Windows" "Build Linux" "Deploy Web App" "Release Workflow")

          FAILED=()
          for WF in "${REQUIRED_WORKFLOWS[@]}"; do
            read -r STATUS CONCLUSION < <(gh api "repos/$REPO/actions/runs?head_sha=$HEAD_SHA&per_page=100" \
              --jq "[.workflow_runs[] | select(.name == \"$WF\")] | first | \"\(.status // \"not_found\") \(.conclusion // \"\")\"")
            echo "$WF: $STATUS $CONCLUSION"
            if [ "$STATUS" != "completed" ]; then
              echo "all_done=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$CONCLUSION" != "success" ]; then
              FAILED+=("$WF ($CONCLUSION)")
            fi
          done

          # Fail loudly rather than skip: announcing a release whose build failed
          # would point latest.json at assets that don't exist. Re-running the
          # failed workflow triggers this one again.
          if [ "${#FAILED[@]}" -gt 0 ]; then
            for F in "${FAILED[@]}"; do
              echo "::error::$F did not succeed — not updating the download manifest or announcing. Re-run it; a successful re-run triggers this workflow again."
            done
            echo "all_done=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # Take the tag from the release that points at this commit, not the
          # newest release — staging leaves drafts behind, and the newest
          # release isn't necessarily the one these builds were for.
          TAG=""
          for T in $(gh release list --repo "$REPO" --exclude-drafts --limit 20 --json tagName --jq '.[].tagName'); do
            if [ "$(gh api "repos/$REPO/commits/$T" --jq .sha)" = "$HEAD_SHA" ]; then
              TAG="$T"
              break
            fi
          done

          if [ -z "$TAG" ]; then
            echo "No published release points at $HEAD_SHA, skipping"
            echo "all_done=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Guard against duplicate sends: if a marker artifact already exists
          # for this tag, a previous run already sent the notification.
          ALREADY_SENT=$(gh api "repos/$REPO/actions/artifacts?name=discord-sent-$TAG&per_page=1" \
            --jq '.total_count')
          if [ "$ALREADY_SENT" -gt "0" ]; then
            echo "Already sent Discord notification for $TAG — skipping"
            echo "all_done=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "all_done=true" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

  get-blurb:
    needs: check
    if: needs.check.outputs.all_done == 'true'
    runs-on: ubuntu-latest
    outputs:
      discord_blurb: ${{ steps.read.outputs.discord_blurb }}
    steps:
      - name: Find blurb artifact run
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.tag_name }}
        run: |
          RUN_ID=$(gh api "repos/$REPO/actions/artifacts?name=discord-blurb-$TAG&per_page=5" \
            --jq '.artifacts | sort_by(.created_at) | reverse | .[0].workflow_run.id // ""')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download blurb artifact
        if: steps.find.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: discord-blurb-${{ needs.check.outputs.tag_name }}
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ github.token }}
          path: /tmp/blurb/

      - name: Read blurb
        id: read
        run: |
          BLURB=$(cat /tmp/blurb/discord_blurb.txt 2>/dev/null || echo "")
          {
            echo 'discord_blurb<<BLURB_EOF'
            printf '%s\n' "$BLURB"
            echo 'BLURB_EOF'
          } >> "$GITHUB_OUTPUT"

  # Rebuilds the docs site from main after latest.json lands, so every
  # download link points at this release before anyone is told about it.
  deploy-docs:
    needs: update-manifest
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      ref: main

  notify:
    needs: [check, get-blurb, deploy-docs]
    if: needs.check.outputs.all_done == 'true'
    uses: ScottKirvan/.github/.github/workflows/reusable-discord-notify.yml@main
    with:
      tag_name: ${{ needs.check.outputs.tag_name }}
      project_name: "QuKi Notes"
      emoji: "🪽"
      discord_blurb: ${{ needs.get-blurb.outputs.discord_blurb }}
    secrets: inherit

  update-manifest:
    needs: check
    if: needs.check.outputs.all_done == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}

      - name: Write latest.json
        env:
          TAG: ${{ needs.check.outputs.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          BASE_URL="https://github.com/$REPO/releases/download/$TAG"
          # AppImage filenames are stable (not versioned) so the documented
          # symlink workflow keeps working across every future release:
          # ln -s ~/Applications/QuKi-Notes-x64.AppImage ~/.local/bin/quki
          # deb and other assets use versioned filenames (normal for packages).
          jq -n \
            --arg version "$TAG" \
            --arg android "$BASE_URL/quki-notes-android-${TAG}.apk" \
            --arg windows "$BASE_URL/quki-notes-windows-${TAG}.exe" \
            --arg linux "$BASE_URL/QuKi-Notes-x64.AppImage" \
            --arg linux_arm64 "$BASE_URL/QuKi-Notes-arm64.AppImage" \
            --arg linux_deb "$BASE_URL/quki-notes-linux-x64-${TAG}.deb" \
            --arg linux_arm64_deb "$BASE_URL/quki-notes-linux-arm64-${TAG}.deb" \
            --arg linux_snap "$BASE_URL/quki-notes-linux-${TAG}.snap" \
            --arg linux_flatpak "$BASE_URL/quki-notes-linux-${TAG}.flatpak" \
            '{version: $version, android: $android, windows: $windows, linux: $linux, linux_arm64: $linux_arm64, linux_deb: $linux_deb, linux_arm64_deb: $linux_arm64_deb, linux_snap: $linux_snap, linux_flatpak: $linux_flatpak}' \
            > docs/public/latest.json

      - name: Commit and push
        env:
          TAG: ${{ needs.check.outputs.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/public/latest.json
          if git diff --cached --quiet; then
            echo "latest.json already up to date for $TAG"
          else
            git commit -m "chore: update download manifest for $TAG"
            git push
          fi

  mark-sent:
    needs: [check, notify]
    if: needs.check.outputs.all_done == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Create sent marker
        run: echo "sent" > /tmp/sent.txt

      - name: Upload sent marker artifact
        uses: actions/upload-artifact@v4
        with:
          name: discord-sent-${{ needs.check.outputs.tag_name }}
          path: /tmp/sent.txt
          retention-days: 90
