name: Build iOS

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no code sign)
        # Produces a .app bundle — not directly installable on a real device
        # without signing. For device install, configure APPLE_CERTIFICATE,
        # PROVISIONING_PROFILE, and TEAM_ID secrets, then switch to:
        #   flutter build ipa --release
        run: flutter build ios --release --no-codesign

      - name: Zip app bundle
        run: |
          cd build/ios/Release-iphoneos
          zip -r ../../../quki-notes-ios.zip Runner.app

      - name: Upload zip as artifact (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: quki-notes-ios
          path: quki-notes-ios.zip
          retention-days: 14

      # iOS build is unsigned and not installable on real devices without signing.
      # Unsigned bundle is not published to GitHub Releases — kept as CI artifact only.
