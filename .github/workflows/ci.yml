name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  actionlint:
    name: Lint workflows
    uses: ScottKirvan/.github/.github/workflows/reusable-actionlint.yml@main

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib/ test/ packages/markdown_live_editor/

      - name: Test
        run: flutter test

      - name: Install dependencies (markdown_live_editor)
        run: flutter pub get
        working-directory: packages/markdown_live_editor

      - name: Test (markdown_live_editor)
        run: flutter test
        working-directory: packages/markdown_live_editor
