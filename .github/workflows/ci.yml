name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  actionlint:
    name: Lint workflows
    uses: ScottKirvan/.github/.github/workflows/reusable-actionlint.yml@main

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            project/package-lock.json
            project/core/package-lock.json
            project/electron/package-lock.json
            project/cli/package-lock.json
            project/mcp/package-lock.json

      # core must be installed, type-checked, built, and tested first —
      # the other packages import from core/dist/
      - name: Install (core)
        run: npm ci
        working-directory: project/core

      - name: Type check (core)
        run: npm run typecheck
        working-directory: project/core

      - name: Test (core)
        run: npm test
        working-directory: project/core

      - name: Build (core)
        run: npm run build
        working-directory: project/core

      # Main Vite app — build runs tsc -b (type check) + vite build
      - name: Install (app)
        run: npm ci
        working-directory: project

      - name: Type check + build (app)
        run: npm run build
        working-directory: project

      - name: Test (app)
        run: npm test
        working-directory: project

      # Electron wrapper
      - name: Install (electron)
        run: npm ci
        working-directory: project/electron

      - name: Type check (electron)
        run: npm run typecheck
        working-directory: project/electron

      - name: Test (electron)
        run: npm test
        working-directory: project/electron

      # CLI
      - name: Install (cli)
        run: npm ci
        working-directory: project/cli

      - name: Type check (cli)
        run: npm run typecheck
        working-directory: project/cli

      - name: Test (cli)
        run: npm test
        working-directory: project/cli

      # MCP server
      - name: Install (mcp)
        run: npm ci
        working-directory: project/mcp

      - name: Type check (mcp)
        run: npm run typecheck
        working-directory: project/mcp

      - name: Test (mcp)
        run: npm test
        working-directory: project/mcp
