name: Build Windows

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install WiX 4
        run: |
          dotnet tool install --global wix --version "4.*"
          $wixVersion = (wix --version).Trim()
          wix extension add "WixToolset.UI.wixext/$wixVersion"

      - name: Get version from pubspec
        id: version
        shell: bash
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Generate app file manifest
        run: powershell installer\harvest.ps1

      - name: Build MSI
        run: >
          wix build installer\Product.wxs installer\AppFiles.wxs
          -arch x64
          -d Version=${{ steps.version.outputs.version }}
          -ext WixToolset.UI.wixext
          -o quki-notes-windows.msi

      - name: Upload MSI as artifact (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: quki-notes-windows
          path: quki-notes-windows.msi
          retention-days: 14

      - name: Upload to GitHub Release
        if: github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: quki-notes-windows.msi
